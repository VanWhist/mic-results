<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MICリザルト">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>選手 | MIC モーグル リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card" id="search-card">
    <h2>選手を探す</h2>
    <div class="controls">
      <label>選手名（部分一致。かな・ローマ字の別名、FIS コード、SAJ 番号でも可）
        <input type="search" id="q" autocomplete="off" placeholder="例：藤村、ふじむら、2538302">
      </label>
    </div>
    <div id="results"></div>
  </div>

  <div class="card" id="athlete-card" hidden>
    <p class="meta"><a href="athlete.html">← 選手を探す</a></p>
    <div id="profile"></div>
  </div>

  <div class="card" id="history-card" hidden>
    <h2>キャリア年表</h2>
    <p class="meta">新しい順。大会名を押すと、そのラウンドの結果表へ移動します。「記録」はどこまで確かめた記録かの段階です。</p>
    <div id="history"></div>
  </div>

  <div class="card" id="chart-card" hidden>
    <h2>得点の推移</h2>
    <div id="chart"></div>
  </div>

  <div class="card" id="jumps-card" hidden>
    <h2>ジャンプ構成</h2>
    <p class="meta">ジャッジ明細のある記録について、ジャンプコード・DD・実施点を並べています。</p>
    <div id="jumps"></div>
  </div>
</main>
<script type="module" src="js/athlete.js"></script>
</body>
</html>
