<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MICリザルト">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<!-- 検索エンジンにインデックスさせない（robots.txt と対で効かせる）。URL を知っていれば見られる状態は変わらない。 -->
<meta name="robots" content="noindex,nofollow">
<title>リザルト | MIC モーグル リザルト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card hero">
    <label class="hero-search">
      <span class="hero-label">選手・大会をさがす</span>
      <input type="search" id="q" autocomplete="off" placeholder="選手名・大会名を検索　例：藤村、全日本、ばんけい">
    </label>
    <div id="suggest" class="suggest" hidden></div>
    <div class="hero-actions">
      <button class="chip" id="toggle-filters" aria-expanded="false">詳しく絞り込む ▼</button>
      <button class="chip" id="reset" hidden>条件をクリア</button>
    </div>
    <div class="controls" id="filters" hidden>
      <label>シーズン<select id="f-season"></select></label>
      <label>区分<select id="f-group"></select></label>
      <label>大会の系列<select id="f-series"></select></label>
      <label>男女<select id="f-gender"></select></label>
      <label>種目<select id="f-discipline"></select></label>
      <label class="check"><input type="checkbox" id="f-mic"> MIC 選手が出た大会だけ</label>
    </div>
    <div id="note-slot"></div>
  </div>

  <div class="card" id="recent-card">
    <h2 id="recent-title">最近の大会</h2>
    <p class="meta">大会を選ぶと、ラウンドごとの結果表を表示します。</p>
    <div id="recent" class="meet-grid"></div>
  </div>
</main>
<script type="module" src="js/index.js"></script>
</body>
</html>
